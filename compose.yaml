services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iriam-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    command: >
      sh -c "
        php artisan migrate --force --seed &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iriam_card
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
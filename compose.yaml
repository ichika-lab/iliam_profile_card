services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iriam-app
    # restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "127.0.0.1:8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  vite:
    image: iriam-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev
    init: true
    restart: "no"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iriam_card
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d iriam_card"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
